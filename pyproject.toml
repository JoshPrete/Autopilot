[tool.black]
line-length = 100
target-version = ["py311"]
exclude = '''
/(
    \.git
  | \.venv
  | venv
  | uploads
  | analysis_outputs
  | analysis/accuracy\.py
  | scripts/daily_autopilot\.py
)/
'''

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".git", ".venv", "venv", "uploads", "analysis_outputs"]

[tool.ruff.lint]
# Conservative defaults: catch syntax/runtime-footgun classes first.
select = ["E9", "F63", "F7", "F82"]
